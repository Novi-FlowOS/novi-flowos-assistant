name: Publish Novi application and ZimaOS store
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: novi-store-publish
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare-github.py "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: zimaos-import
          path: Apps/NoviFlowOSAssistant/docker-compose.yml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
  build-store:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare-github.py "$GITHUB_REPOSITORY"
      - name: Require publicly installable image
        run: python scripts/verify-public-image.py "$GITHUB_REPOSITORY"
      - name: Build ZimaOS store v2
        uses: IceWhaleTech/build-appstore-action@v1.1.2
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          report-json: out/store-build-report.json
      - run: python scripts/check-store-output.py dist
      - name: Build legacy store archive
        run: python scripts/build-legacy-store.py --output dist/store/main.zip
      - name: No GitHub Pages processing
        run: touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-build-report
          path: out/store-build-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: novi-appstore-dist
          path: dist
          include-hidden-files: true
  deploy-store:
    needs: build-store
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: novi-appstore-dist
          path: dist
      - name: Publish catalog branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
      - name: Store address
        run: |
          echo "### ZimaOS store" >> "$GITHUB_STEP_SUMMARY"
          echo "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/" >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy ZIP: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/store/main.zip" >> "$GITHUB_STEP_SUMMARY"
