name: novi-flowos-assistant
services:
  assistant:
    image: ghcr.io/novi-flowos/novi-flowos-assistant:latest@sha256:23845adfacfb1c5c46f33d361ac74c39d18b56b2750a5f075e08f6eb9bea0a2f
    container_name: novi-flowos-assistant
    restart: unless-stopped
    ports:
      - "48103:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
      PANEL_ACCESS_KEY: ""
    volumes:
      - type: bind
        source: /DATA/AppData/novi-flowos-assistant
        target: /state
      - type: bind
        source: /DATA/FlowOS
        target: /reference/system
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/Storage Shared/FlowOS
        target: /reference/ssd
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/Storage Shared/Novi CDN
        target: /reference/cdn
        read_only: true
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
  ollama:
    image: ollama/ollama:latest@sha256:44833c52df2a164cc1238a96ce100123c8e54082b85c5e235a9cb5a7adc55f27
    container_name: novi-flowos-ai
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - /DATA/AppData/novi-flowos-ai:/root/.ollama
    mem_limit: 2g
    cpus: 2
  model-init:
    image: ollama/ollama:latest@sha256:44833c52df2a164cc1238a96ce100123c8e54082b85c5e235a9cb5a7adc55f27
    depends_on:
      - ollama
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: /bin/sh
    command:
      - -c
      - until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3:0.6b
x-casaos:
  id: pl.org.novi.flowos-assistant
  main: assistant
  index: /
  port_map: "48103"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/Novi-FlowOS/novi-flowos-assistant@gh-pages/apps/pl.org.novi.flowos-assistant/assets/icon.svg
  title:
    en_US: Novi FlowOS Assistant
    pl_PL: Novi FlowOS Assistant
  version: "0.1.0"
